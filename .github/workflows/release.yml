name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run site
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            site/downloads/neoskins-viewer.standalone.js
            site/downloads/neoskins-viewer.standalone.js.map
            site/downloads/neoskins-viewer.js
            site/downloads/neoskins-viewer.js.map
            site/downloads/neoskins-client.js
            site/downloads/neoskins-viewer-*.tgz
